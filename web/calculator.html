<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Máy tính cộng trừ</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f2f2f2;
            }

            .container {
                width: 400px;
                margin: 80px auto;
                padding: 30px;
                background: white;
                border-radius: 10px;
                box-shadow: 0 0 10px #aaa;
            }

            h2 {
                text-align: center;
                color: #333;
            }

            input,
            select,
            button {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                box-sizing: border-box;
            }

            button {
                background: #2196F3;
                color: white;
                border: none;
                cursor: pointer;
            }

            button:hover {
                background: #1976D2;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <h2>Máy tính cộng trừ</h2>

            <form action="CalculatorServlet" method="post">

                <label>Số A:</label>

                <input type="number"
                       name="a"
                       step="any"
                       required>

                <label>Số B:</label>

                <input type="number"
                       name="b"
                       step="any"
                       required>

                <label>Phép toán:</label>

                <select name="op">

                    <option value="+">
                        Cộng (+)
                    </option>

                    <option value="-">
                        Trừ (-)
                    </option>

                </select>

                <button type="submit">
                    Tính
                </button>

            </form>

        </div>

    </body>
</html>
