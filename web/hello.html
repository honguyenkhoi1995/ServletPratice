<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chào người dùng</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Chào người dùng</h2>

    <form action="HelloServlet" method="get">

        <label>Nhập tên:</label>

        <input type="text"
               name="name"
               placeholder="Nhập tên của bạn">

        <button type="submit">
            Gửi
        </button>

    </form>

</div>

</body>
</html>
