<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đổi màu nền</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #673AB7;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Chọn màu nền</h2>

    <form action="ColorServlet" method="get">

        <select name="color">

            <option value="red">
                Đỏ
            </option>

            <option value="blue">
                Xanh
            </option>

            <option value="green">
                Lá
            </option>

        </select>

        <button type="submit">
            Đổi màu
        </button>

    </form>

</div>

</body>
</html>
